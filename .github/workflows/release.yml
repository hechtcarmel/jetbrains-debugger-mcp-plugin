# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [prereleased, released]

# One release pipeline per tag; a re-run of the same tag queues instead of racing,
# and releases for different tags never share the changelog branch concurrently.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

# Least privilege: no default token scopes; the job declares exactly what it needs.
permissions: {}

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      # The Marketplace channel is derived from the SemVer pre-release label, not from the
      # GitHub pre-release flag. A stable version published from a GitHub pre-release would
      # silently ship to the STABLE 'default' channel — refuse it.
      - name: Assert release channel matches the pre-release flag
        env:
          VERSION: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$VERSION" in
            *-*) HAS_LABEL=true ;;
            *)   HAS_LABEL=false ;;
          esac
          if [ "$IS_PRERELEASE" = "true" ] && [ "$HAS_LABEL" = "false" ]; then
            echo "::error::GitHub release '$VERSION' is marked as a pre-release, but its version has no SemVer pre-release label, so it would publish to the STABLE 'default' Marketplace channel. Either publish it as a full release, or re-tag with a pre-release label (e.g. '$VERSION-rc.1')."
            exit 1
          fi
          if [ "$IS_PRERELEASE" = "false" ] && [ "$HAS_LABEL" = "true" ]; then
            echo "::warning::GitHub release '$VERSION' is a full release but carries a SemVer pre-release label; it will publish to a non-default Marketplace channel."
          fi

      # Refuse to go anywhere near publishPlugin without the full signing + publishing secret set.
      # Without this, signPlugin silently onlyIf-skips and the UNSIGNED zip ships, green.
      - name: Assert signing and publishing secrets are present
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          missing=""
          for v in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD PUBLISH_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish - missing secrets:$missing"
            exit 1
          fi

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Produce the signed archive and verify its signature BEFORE publishing.
      # This step failing means nothing reaches the Marketplace.
      - name: Sign Plugin and Verify Signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin verifyPluginSignature

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        id: publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload the signed archive — and only the signed archive — as a release asset.
      # Guarded on the publish outcome so a failed publish never decorates the release,
      # and --clobber makes a re-run idempotent.
      - name: Upload Release Asset
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*-signed.zip --clobber

      # Create a pull request with the patched changelog. Guarded on the publish outcome, and
      # skipped cleanly when patchChangelog was a no-op (nothing to commit).
      - name: Create Pull Request
        if: ${{ always() && steps.publish.outcome == 'success' && github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged - nothing to open a pull request for."
            exit 0
          fi

          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
