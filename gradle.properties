# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.github.hechtcarmel.jetbrainsdebuggermcpplugin
pluginName = Debugger MCP Server
pluginRepositoryUrl = https://github.com/hechtcarmel/jetbrains-debugger-mcp-plugin
# SemVer format -> https://semver.org
pluginVersion = 5.0.1

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 252 (2025.2) is the floor because the MCP Kotlin SDK cannot link below it:
#   - SDK Server.<init> reaches kotlin.time.Clock, absent from 2025.1's bundled stdlib
#   - Ktor >= 3.2.1 calls CoroutineDispatcher.limitedParallelism$default, absent from
#     2025.1's bundled kotlinx-coroutines 1.8.0-intellij
# Both are present from 2025.2 (coroutines 1.10.1-intellij), verified against lib/util-8.jar
# of both distributions. McpSdkAssumptionsTest constructs a Server on the target platform.
pluginSinceBuild = 252

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
# NOTE: We build against IntelliJ (IC) for compilation, but the plugin works in ALL JetBrains IDEs.
# Language-specific tools (type hierarchy, call hierarchy, etc.) are loaded via reflection at runtime
# and adapt to the available language plugins:
# - Java/Kotlin: IntelliJ IDEA, Android Studio
# - Python: PyCharm (all editions), IntelliJ with Python plugin
# - JavaScript/TypeScript: WebStorm, IntelliJ Ultimate, PhpStorm
# Use runPluginVerifier to test against different IDEs.
platformType = IC
platformVersion = 2025.2.6

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
platformPlugins =
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins = com.intellij.java,org.jetbrains.kotlin
# Example: platformBundledModules = intellij.spellchecker
platformBundledModules =

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.0.0

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
