[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"

# MCP and HTTP
# 0.10.0 is the highest SDK that compiles under Kotlin 2.1.20 — 0.11+ ship dependencies whose
# Kotlin metadata is 2.3/2.4, which this compiler refuses to read. Raising the SDK requires
# raising `kotlin` below first.
mcpKotlinSdk = "0.15.0"
# Dictated by the SDK: kotlin-sdk-server depends on ktor-server-core/sse at this version.
# Declaring anything lower is fiction — Gradle conflict resolution picks the SDK's version anyway,
# which is exactly how this project silently ran Ktor 3.0.2 while declaring 2.3.12.
# Ktor >= 3.2.1 needs CoroutineDispatcher.limitedParallelism$default, hence pluginSinceBuild = 252.
ktor = "3.5.2"
kotlinxSerializationJson = "1.11.0"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.18.1"
kotlin = "2.4.10"
kotlinSerialization = "2.4.10"
kover = "0.9.9"
qodana = "2025.2.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }

# MCP Kotlin SDK — split artifacts, never the `kotlin-sdk-jvm` monolith.
# The monolith drags in kotlin-sdk-client and the whole Ktor *client* stack, which is what puts
# ktor-client-core's unresolvable `limitedParallelism$default` reference into the distribution.
mcp-kotlin-sdk-core = { group = "io.modelcontextprotocol", name = "kotlin-sdk-core-jvm", version.ref = "mcpKotlinSdk" }
mcp-kotlin-sdk-server = { group = "io.modelcontextprotocol", name = "kotlin-sdk-server-jvm", version.ref = "mcpKotlinSdk" }

# Ktor Server. ktor-server-sse is required by the SDK's SSE and Streamable HTTP transports.
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-sse = { group = "io.ktor", name = "ktor-server-sse", version.ref = "ktor" }
# The SDK responds with @Serializable error envelopes, so ContentNegotiation is mandatory at
# 0.10.0. (0.11.0+ install it themselves; until then, an uninstalled one means empty bodies.)
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerialization" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
